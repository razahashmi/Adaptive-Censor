<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outline review · Adaptive Censor</title><link rel="stylesheet" href="/masks.css"></head>
<body><header><a href="/">Adaptive Censor</a><strong>Outline review</strong><a href="/batch.html">Review batch</a><a href="/label.html">Video labels</a><a href="/roi.html">Crop labels</a><select id="project" aria-label="Mask collection"></select></header>
<main><p id="definition">Paint only the visible target anatomy.</p><p>This changes training labels; it does not change playback.</p>
<div class="toolbar"><button id="paint" aria-pressed="true">Paint</button><button id="erase" aria-pressed="false">Erase</button><label>Brush <input id="brush" type="range" min="2" max="40" value="10"></label><button id="undo">Undo</button><button id="clear">Clear outline</button><button id="draft">Use suggested outline</button></div>
<p id="blind"></p><label>Preview <select id="view"><option value="outline">Outline</option><option value="blur">Blur selected pixels</option><option value="hide">Conceal selected pixels</option></select></label><div class="pictures"><section><h2>Original</h2><img id="original" alt="Original frame"></section><section><h2>Outline / filtered preview</h2><canvas id="editor" aria-label="Editable target outline"></canvas></section></div>
<p id="detail"></p><p id="status" role="status"></p><footer><button id="previous">Previous</button><button id="save">Save & next</button><button id="clean">No target here</button><button id="unsure">Unsure</button><button id="next">Next</button></footer></main><script type="module" src="/masks.mjs?v=2"></script></body></html>
